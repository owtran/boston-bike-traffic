<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Boston Bike Traffic</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Your CSS -->
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="map.css">

    <!-- Mapbox CSS -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <!-- Your JavaScript -->
    <script src="map.js" type="module"></script>
</head>

<body>
    <header>
    <h1>🚴 Boston Bike Traffic</h1>

    <label>
        Filter by time:
        <input
            type="range"
            id="time-slider"
            min="-1"
            max="1440"
            value="-1"
        >

        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
    </label>
    </header>

    <p>
        Interactive visualization of bike traffic
        across Boston and Cambridge.
    </p>

    <!-- Map appears here -->
    <div id="map">
        <svg></svg>
    </div>

    <!-- STEP 6.2: Traffic flow legend -->
<div class="legend">
    <div style="--departure-ratio: 1">More departures</div>
    <div style="--departure-ratio: 0.5">Balanced</div>
    <div style="--departure-ratio: 0">More arrivals</div>
</div>

</body>
</html>
